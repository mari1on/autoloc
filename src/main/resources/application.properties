spring.application.name=autoloc-api


spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO
server.port=8081
#!!!
#server.servlet.context-path=/api
server.servlet.context-path=/autoloc-api
#!!!!!!!!!!!
# Jackson: do not fail on Hibernate LAZY proxy empty beans (provisional, removed with DTOs)
spring.jackson.serialization.fail-on-empty-beans=false

springdoc.group-configs[0].group=Gestion Agences
springdoc.group-configs[0].paths-to-match=/agences/**
springdoc.group-configs[1].group=Gestion Clients
springdoc.group-configs[1].paths-to-match=/clients/**
springdoc.group-configs[2].group=Gestion Contrats
springdoc.group-configs[2].paths-to-match=/contrats/**
springdoc.group-configs[3].group=Gestion Employés
springdoc.group-configs[3].paths-to-match=/employes/**
springdoc.group-configs[4].group=Gestion Équipements
springdoc.group-configs[4].paths-to-match=/equipements/**
springdoc.group-configs[5].group=Gestion Maintenances
springdoc.group-configs[5].paths-to-match=/maintenances/**
springdoc.group-configs[6].group=Gestion Paiements
springdoc.group-configs[6].paths-to-match=/paiements/**
springdoc.group-configs[7].group=Gestion Réservations
springdoc.group-configs[7].paths-to-match=/reservations/**
springdoc.group-configs[8].group=Gestion Véhicules
springdoc.group-configs[8].paths-to-match=/vehicules/**
